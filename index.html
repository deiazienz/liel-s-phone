<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liel's Phone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="phone-frame">
        <!-- LOCK SCREEN -->
        <div id="lock-screen" class="screen active">
            <div class="lock-content">
                <div class="lock-clock">
                    <span class="time-display" id="current-time">1:28</span>
                    <p id="current-date">Saturday, November 7</p>
                </div>

                <div class="passcode-section">
                    <p class="passcode-prompt">Enter Passcode</p>
                    <div class="passcode-dots">
                        <span class="dot" id="dot-0"></span>
                        <span class="dot" id="dot-1"></span>
                        <span class="dot" id="dot-2"></span>
                        <span class="dot" id="dot-3"></span>
                    </div>
                    <div class="keypad">
                        <button onclick="pressKey(1)">1</button>
                        <button onclick="pressKey(2)">2</button>
                        <button onclick="pressKey(3)">3</button>
                        <button onclick="pressKey(4)">4</button>
                        <button onclick="pressKey(5)">5</button>
                        <button onclick="pressKey(6)">6</button>
                        <button onclick="pressKey(7)">7</button>
                        <button onclick="pressKey(8)">8</button>
                        <button onclick="pressKey(9)">9</button>
                        <button onclick="pressKey(0)">0</button>
                        <button onclick="deleteKey()"><i class="fa-solid fa-delete-left"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- HOME SCREEN -->
        <div id="home-screen" class="screen">
            <div class="status-bar dark">
                <span class="home-time">1:28</span>
                <div class="status-icons">
                    <i class="fa-solid fa-signal"></i>
                    <i class="fa-solid fa-wifi"></i>
                    <i class="fa-solid fa-battery-full"></i>
                </div>
            </div>

            <!-- Locket Widget -->
            <div class="widget locket-widget" onclick="openApp('photos')">
                <div class="locket-header">
                    <i class="fa-solid fa-heart"></i>
                    <span>Locket</span>
                </div>
                <div class="locket-img-container">
                    <img src="locket1.jpg" alt="Locket photo">
                </div>
                <p class="locket-caption">ayghh</p>
            </div>

            <!-- Reminder Widget -->
            <div class="widget reminder-widget">
                <div class="reminder-header">
                    <i class="fa-solid fa-bell"></i>
                    <span>Reminders</span>
                </div>
                <p>work work work by rihanna</p>
            </div>

            <!-- App Icons Grid -->
            <div class="apps-grid">
                <div class="app-icon" onclick="openApp('notes')">
                    <div class="icon-bg yellow"><i class="fa-solid fa-sticky-note"></i></div>
                    <span>Notes</span>
                </div>
                <div class="app-icon" onclick="openApp('calendar')">
                    <div class="icon-bg red"><i class="fa-solid fa-calendar"></i></div>
                    <span>Calendar</span>
                </div>
                <div class="app-icon" onclick="openApp('clock')">
                    <div class="icon-bg black"><i class="fa-solid fa-clock"></i></div>
                    <span>Clock</span>
                </div>
                <div class="app-icon" onclick="openApp('photos')">
                    <div class="icon-bg orange"><i class="fa-solid fa-image"></i></div>
                    <span>Photos</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
